<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Eventora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page" data-page="register">
  <header class="site-header auth-header"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-sparkles"></i></span>eventora</a><a class="nav-login" href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to discover</a></header>
  <main class="auth-layout">
    <section class="auth-aside"><p class="eyebrow eyebrow-light">YOUR NEXT CHAPTER</p><h1>Make a little<br><em>more happen.</em></h1><p>Find your people, discover something new, or bring an idea to life.</p><div class="aside-quote"><i class="fa-solid fa-quote-left"></i><span>“The best stories start with showing up.”</span></div></section>
    <section class="auth-form-wrap"><form class="auth-form" id="register-form" novalidate>
      <p class="eyebrow">CREATE YOUR ACCOUNT</p><h2>Welcome to Eventora</h2><p class="form-intro">A few details and you're in.</p>
      <label for="full-name">Full name</label><input id="full-name" name="name" autocomplete="name" placeholder="e.g. Alex Morgan" required>
      <label for="register-email">Email address</label><input id="register-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="register-phone">Phone number <span class="optional">Optional</span></label><input id="register-phone" name="phone" type="tel" autocomplete="tel" placeholder="+1 555 000 0000">
      <label for="register-role">I’m joining as</label><select id="register-role" name="role" required><option value="customer">Customer · discover and attend</option><option value="organizer">Organizer · create events</option></select>
      <label for="register-password">Password</label><div class="password-field"><input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required><button type="button" class="password-toggle" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div>
      <label class="check-label"><input id="terms" type="checkbox" required><span>I understand this is a demo account stored in this browser.</span></label>
      <p class="form-error" id="register-error" role="alert"></p><button class="button button-wide" type="submit">Create account <i class="fa-solid fa-arrow-right"></i></button>
      <p class="switch-auth">Already have an account? <a href="login.html">Log in</a></p>
    </form></section>
  </main>
  <div class="toast-region" aria-live="polite" aria-atomic="true"></div><script src="js/database.js"></script><script src="js/app.js"></script>
</body>
</html>
